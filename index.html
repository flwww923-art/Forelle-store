<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Forelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Forelle</h1>
            <div class="flex items-center gap-2 bg-pink-50 text-pink-600 px-3 py-1.5 rounded-full text-sm font-medium">
                <i class="fa-solid fa-location-dot"></i> تيزي وزو، شارع كريم بلقاسم
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-gray-900 to-gray-800 text-white py-12 px-4 text-center">
        <h2 class="text-3xl font-bold mb-3">أرقى الأكسسوارات والأزياء النسائية</h2>
        <p class="text-gray-300 max-w-xl mx-auto text-sm">اطلبي الآن مباشرة عبر الواتساب واستفيدي من توصيل سريع.</p>
    </section>

    <!-- Products Grid -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <h3 class="text-xl font-bold text-gray-800 mb-6 border-r-4 border-pink-600 pr-3">منتجاتنا المميزة</h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="products-container">
            <!-- منتج تجريبي 1 -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500&auto=format&fit=crop&q=60" alt="حقيبة نسائية" class="w-full h-56 object-cover">
                <div class="p-4 flex flex-col flex-grow">
                    <h4 class="font-bold text-gray-800 text-lg mb-1">حقيبة يد فاخرة</h4>
                    <p class="text-pink-600 font-bold mb-4">6500 دج</p>
                    <button onclick="orderOnWhatsApp('حقيبة يد فاخرة', '6500 دج')" class="mt-auto w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                        <i class="fa-brands fa-whatsapp text-lg"></i> اطلب عبر الواتساب
                    </button>
                </div>
            </div>

            <!-- منتج تجريبي 2 -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=500&auto=format&fit=crop&q=60" alt="حقيبة أنيقة" class="w-full h-56 object-cover">
                <div class="p-4 flex flex-col flex-grow">
                    <h4 class="font-bold text-gray-800 text-lg mb-1">حقيبة كتف أنيقة</h4>
                    <p class="text-pink-600 font-bold mb-4">5800 دج</p>
                    <button onclick="orderOnWhatsApp('حقيبة كتف أنيقة', '5800 دج')" class="mt-auto w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                        <i class="fa-brands fa-whatsapp text-lg"></i> اطلب عبر الواتساب
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-gray-500 text-sm">
        <p>جميع الحقوق محفوظة © Forelle 2026</p>
    </footer>

    <script>
        function orderOnWhatsApp(productName, productPrice) {
            const phoneNumber = "213798555097";
            const message = `مرحباً، أريد طلب هذا المنتج:\n\n*${productName}*\nالسعر: ${productPrice}`;
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        }
    </script>

</body>
</html>
