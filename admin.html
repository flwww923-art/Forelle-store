
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Forelle Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f8; color: #2c2c2c; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-gray-900 font-black text-xl">F</div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider">لوحة تحكم Forelle</h1>
                    <p class="text-xs text-gray-400">إدارة المنتجات بسهولة تامة</p>
                </div>
            </div>
            <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm transition flex items-center">
                <i class="fa-solid fa-store ml-2"></i> مشاهدة المتجر
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Add Product Form -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                <i class="fa-solid fa-plus-circle text-amber-500 ml-2"></i> إضافة منتج جديد
            </h2>
            <form id="productForm" onsubmit="addProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">اسم المنتج</label>
                    <input type="text" id="pName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-amber-500 text-sm bg-gray-50" placeholder="مثال: حقيبة جلد فاخرة">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">السعر (مثال: 12,000 دج)</label>
                    <input type="text" id="pPrice" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-amber-500 text-sm bg-gray-50" placeholder="12,000 دج">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">رابط الصورة (URL)</label>
                    <input type="url" id="pImage" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-amber-500 text-sm bg-gray-50" placeholder="https://example.com/image.jpg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">وصف قصير</label>
                    <textarea id="pDesc" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-amber-500 text-sm bg-gray-50" placeholder="تفاصيل المنتج..."></textarea>
                </div>
                <button type="submit" class="w-full bg-gray-900 hover:bg-amber-600 text-white py-3 rounded-xl font-medium transition shadow-sm text-sm">
                    حفظ ونشر المنتج
                </button>
            </form>
        </div>

        <!-- Products List Management -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center justify-between">
                <span><i class="fa-solid fa-boxes-stacked text-amber-500 ml-2"></i> قائمة المنتجات الحالية</span>
                <span id="adminCount" class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full">0 منتج</span>
            </h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b text-xs text-gray-400 uppercase bg-gray-50">
                            <th class="p-3">المنتج</th>
                            <th class="p-3">السعر</th>
                            <th class="p-3">الوصف</th>
                            <th class="p-3 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- يتم ملؤها ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-10">
        <p>لوحة تحكم متجر Forelle النسائي ©️ 2026</p>
    </footer>

    <script>
        function getProducts() {
            return JSON.parse(localStorage.getItem('forelle_products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('forelle_products', JSON.stringify(products));
        }

        function renderAdminTable() {
            const products = getProducts();
            const tbody = document.getElementById('adminTableBody');
            const countLabel = document.getElementById('adminCount');
            
            countLabel.innerText = `${products.length} منتج`;
            tbody.innerHTML = '';

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400">لا توجد منتجات مضافة حالياً. قم بإضافة منتج من القائمة الجانبية.</td></tr>`;
                return;
            }

            products.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/50 transition";
                tr.innerHTML = `
                    <td class="p-3 flex items-center space-x-3 space-x-reverse">
                        <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover border shadow-2xs" onerror="this.src='https://via.placeholder.com/50'">
                        <div>
                            <div class="font-bold text-gray-900">${p.name}</div>
                        </div>
                    </td>
                    <td class="p-3 font-semibold text-amber-600">${p.price}</td>
                    <td class="p-3 text-gray-500 text-xs max-w-xs truncate">${p.desc || '-'}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteProduct(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                            <i class="fa-solid fa-trash ml-1"></i> حذف
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const image = document.getElementById('pImage').value;
            const desc = document.getElementById('pDesc').value;

            const products = getProducts();
            products.unshift({ id: Date.now(), name, price, image, desc });
            saveProducts(products);

            document.getElementById('productForm').reset();
            renderAdminTable();
            alert('تم إضافة المنتج بنجاح وتم تحديث المتجر الفوري!');
        }

        function deleteProduct(index) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) {
                const products = getProducts();
                products.splice(index, 1);
                saveProducts(products);
                renderAdminTable();
            }
        }

        window.onload = renderAdminTable;
    </script>
</body>
</html>
