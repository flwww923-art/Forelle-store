<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر Forelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Supabase للربط بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-gray-900 text-white shadow py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">لوحة تحكم Forelle</h1>
        <a href="index.html" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded transition">عرض المتجر <i class="fa-solid fa-arrow-left mr-1"></i></a>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <!-- نموذج إعدادات Supabase المؤقت -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-4">إعدادات الاتصال بـ Supabase</h2>
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Supabase URL</label>
                    <input type="text" id="supabaseUrl" placeholder="https://xxxx.supabase.co" class="w-full border rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Supabase Anon Key</label>
                    <input type="password" id="supabaseKey" placeholder="eyJh..." class="w-full border rounded-lg p-2.5 text-sm">
                </div>
                <button onclick="saveConfig()" class="bg-blue-600 text-white py-2 px-4 rounded-lg text-sm font-medium hover:bg-blue-700 transition">حفظ بيانات الاتصال</button>
            </div>
        </div>

        <!-- نموذج إضافة منتج جديد -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-4">إضافة منتج جديد للمتجر</h2>
            <form id="productForm" onsubmit="addProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اسم المنتج</label>
                    <input type="text" id="pName" required class="w-full border rounded-lg p-2.5 text-sm" placeholder="مثال: حقيبة يد جلدية">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">السعر (دج)</label>
                    <input type="number" id="pPrice" required class="w-full border rounded-lg p-2.5 text-sm" placeholder="مثال: 6500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">رابط الصورة (Image URL)</label>
                    <input type="url" id="pImage" required class="w-full border rounded-lg p-2.5 text-sm" placeholder="ضع رابط الصورة هنا">
                </div>
                <button type="submit" class="w-full bg-pink-600 text-white py-2.5 rounded-lg font-medium hover:bg-pink-700 transition">إضافة المنتج ونشره</button>
            </form>
        </div>
    </main>

    <script>
        function saveConfig() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;
            localStorage.setItem('sb_url', url);
            localStorage.setItem('sb_key', key);
            alert('تم حفظ إعدادات الاتصال بنجاح!');
        }

        function addProduct(e) {
            e.preventDefault();
            alert('تم تجهيز النموذج! سنقوم بربطه بقاعدة البيانات فور إدخال معلومات Supabase الخاصة بك.');
        }
    </script>
</body>
</html>
